name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Mise tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key: mise-v1-${{ runner.os }}-${{ hashFiles('mise.toml', 'package-lock.json') }}

      - name: Install dependencies
        run: mise run setup

      - name: Check types
        run: mise run typecheck

      - name: Run tests
        run: mise run test

      - name: Build plugin
        run: mise run build

      - name: Verify plugin package
        run: test -s PluginZip.zip
